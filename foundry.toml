[profile.default]
src = "src"
out = "out"
libs = ["lib", "node_modules"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
evm_version = "paris"
via_ir = false
# Deterministic creation code: no IPFS/Swarm metadata hash in the bytecode,
# so the CREATE2 init code (and the frontend's embedded copy) is stable
# across builds and reproducible by the audit.
bytecode_hash = "none"
cbor_metadata = false
# Deploy script writes deployments.json after a successful broadcast.
fs_permissions = [{ access = "write", path = "deployments.json" }, { access = "write", path = "deployments-v2.json" }, { access = "write", path = "deployments-v3.json" }, { access = "write", path = "deployments-vanity.json" }]

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 128
